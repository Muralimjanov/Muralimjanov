<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="0.5" stop-color="#1a1240"/><stop offset="1" stop-color="#0b2a3a"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" x2="1">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="260" rx="18" fill="url(#bg)"/>
  <g fill="#22d3ee" opacity="0.5">
    <circle cx="120" cy="60" r="3"><animate attributeName="cy" values="60;40;60" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="210" r="2"><animate attributeName="cy" values="210;190;210" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="45" r="2.5"><animate attributeName="cy" values="45;65;45" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="200" r="3"><animate attributeName="cy" values="200;178;200" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="70" r="2"><animate attributeName="cy" values="70;90;70" dur="5.5s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.35">
    <circle cx="860" cy="130" r="70"><animate attributeName="r" values="60;80;60" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="130" r="105"><animate attributeName="r" values="95;115;95" dur="7s" repeatCount="indefinite"/></circle>
  </g>
  <text x="60" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#txt)" filter="url(#glow)">
    Muralimjanov
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="62" y="170" font-family="Consolas, monospace" font-size="24" fill="#c9d1d9">Full-Stack Developer · TypeScript · Node · React
    <animate attributeName="opacity" values="0;1" begin="0.8s" dur="1.2s" fill="freeze"/>
  </text>
  <rect x="62" y="190" width="0" height="4" rx="2" fill="url(#txt)">
    <animate attributeName="width" values="0;340" begin="1.2s" dur="1.2s" fill="freeze"/>
  </rect>
  <text x="62" y="228" font-family="Consolas, monospace" font-size="18" fill="#22d3ee">&gt; building CRMs, marketplaces &amp; APIs<tspan>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>_</tspan></text>
</svg>
